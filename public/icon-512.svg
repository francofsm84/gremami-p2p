<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2329"/>
      <stop offset="100%" stop-color="#0B0E11"/>
    </linearGradient>
    <linearGradient id="btcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0B90B"/>
      <stop offset="50%" stop-color="#F7931A"/>
      <stop offset="100%" stop-color="#E07D09"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="210" stroke="url(#btcGrad)" stroke-width="8" fill="none" opacity="0.3"/>
  <!-- Bitcoin outer ring -->
  <circle cx="256" cy="256" r="180" fill="url(#btcGrad)" filter="url(#glow)"/>
  <!-- Inner symbol G stylized like Bitcoin -->
  <path d="M 280 140 L 280 180 M 240 140 L 240 180 M 280 332 L 280 372 M 240 332 L 240 372" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
  <!-- G symbol with crypto nodes -->
  <path d="M 330 220 C 315 190 280 175 240 175 C 190 175 155 210 155 260 C 155 310 190 345 245 345 C 295 345 330 315 335 270 L 245 270" 
        stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Node dots -->
  <circle cx="335" cy="270" r="14" fill="#0B0E11" stroke="#FFFFFF" stroke-width="6"/>
  <circle cx="245" cy="270" r="10" fill="#FFFFFF"/>
</svg>
